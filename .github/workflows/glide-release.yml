name: GLIDE release

# Push a tag like glide-v0.2.1 (matching "version" in glide/package.json) to publish a release.
# Installed copies of GLIDE pick it up automatically through the in-app updater, which reads
# latest.yml from the newest release — so the installer, its blockmap and latest.yml are uploaded together.
on:
  push:
    tags: ['glide-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: glide } }
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: glide/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Build only; the release itself is created once, below, on the tag that was pushed.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GLIDE ${{ github.ref_name }}
          make_latest: 'true'
          files: |
            glide/release/GLIDE-Setup-*.exe
            glide/release/GLIDE-Setup-*.exe.blockmap
            glide/release/latest.yml
          fail_on_unmatched_files: true
