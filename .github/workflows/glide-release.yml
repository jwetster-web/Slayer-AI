name: GLIDE release

# Push a tag like glide-v0.2.0 (matching "version" in glide/package.json) to publish a release.
# Installed copies of GLIDE pick it up automatically through the in-app updater.
on:
  push:
    tags: ['glide-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: glide } }
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: glide/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --win --publish always
